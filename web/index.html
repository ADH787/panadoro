<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b100c">
  <meta name="description" content="Panadoro — habits, tasks and tagged focus in one quiet place.">
  <title>Panadoro</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/app.css">
  <script>
    try {
      const stored = JSON.parse(localStorage.getItem("panadoro.settings.v1") || "{}");
      const dark = stored.theme === "dark" || ((!stored.theme || stored.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      const lang = stored.language === "ar" || (!stored.language && navigator.language.toLowerCase().startsWith("ar")) ? "ar" : "en";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    } catch (_) {}
  </script>
</head>
<body>
  <div id="app">
    <div class="shell boot-shell">
      <aside class="rail boot-rail">
        <div class="brand"><div class="skeleton" style="width:30px;height:30px"></div><div style="flex:1"><div class="skeleton boot-line" style="width:80px"></div><div class="skeleton boot-line short" style="width:110px"></div></div></div>
        <div class="stack" style="gap:6px">
          <div class="skeleton boot-nav"></div>
          <div class="skeleton boot-nav"></div>
          <div class="skeleton boot-nav"></div>
          <div class="skeleton boot-nav"></div>
          <div class="skeleton boot-nav"></div>
        </div>
      </aside>
      <div class="main">
        <header class="topbar"><div class="topbar-title"><div class="skeleton boot-line" style="width:150px;height:16px"></div><div class="skeleton boot-line short" style="width:220px"></div></div></header>
        <main class="page">
          <div class="skeleton-page">
            <div class="skeleton skeleton-hero"></div>
            <div class="skeleton-grid">
              <div class="skeleton skeleton-tile"></div>
              <div class="skeleton skeleton-tile"></div>
              <div class="skeleton skeleton-tile"></div>
            </div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" class="confetti-canvas"></canvas>
  <div id="celebration" class="celebration" role="dialog" aria-modal="true" aria-live="polite">
    <div class="celebration-card">
      <div id="celebration-icon" class="celebration-icon"></div>
      <h2 id="celebration-title"></h2>
      <p id="celebration-text"></p>
      <button class="btn filled" data-action="close-celebration">Nice</button>
    </div>
  </div>
  <noscript>Panadoro needs JavaScript to run.</noscript>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
